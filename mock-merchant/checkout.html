<!DOCTYPE html>
<html>
<head>
  <title>DevOps Cloud Credits Checkout</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; borderRadius: 8px; }
    input, button { width: 100%; margin-top: 10px; padding: 10px; box-sizing: border-box; }
    button { background: #0066cc; color: white; border: none; font-weight: bold; cursor: pointer; }
    #success { display: none; color: green; font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>
  <h2>💳 Top Up Cloud API Credits ($20.00)</h2>
  <form id="payment-form" onsubmit="event.preventDefault(); document.getElementById('success').style.display='block';">
    <label>Cardholder Name</label>
    <input type="text" id="cardholder" placeholder="Agent DevBudget" required />
    
    <label>Card Number</label>
    <input type="text" id="cardnumber" placeholder="4000 0000 0000 0000" required />
    
    <label>Expiry Date</label>
    <input type="text" id="expiry" placeholder="MM/YY" required />
    
    <label>CVV</label>
    <input type="text" id="cvv" placeholder="123" required />
    
    <button type="submit" id="pay-button">Pay $20.00 via Prava Card</button>
  </form>
  <div id="success">✅ Transaction Approved! Receipt #PRV-88291</div>
</body>
</html>
