<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevBudget Agent Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 to-slate-200 flex items-center justify-center p-6">
  <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl p-8">
    <h1 class="text-2xl font-bold text-slate-800 mb-1">DevBudget Agent Dashboard</h1>
    <p class="text-sm text-slate-500 mb-6">Configure the autonomous top-up rules for your cloud services.</p>

    <form id="rules-form" class="space-y-5">
      <div>
        <label for="merchants" class="block text-sm font-medium text-slate-700 mb-1">Allowed Merchants (comma separated)</label>
        <input
          type="text"
          id="merchants"
          required
          placeholder="OpenAI API Top-Up, AWS Credits, Vercel Overage"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label for="maxLimit" class="block text-sm font-medium text-slate-700 mb-1">Max Single Transaction Limit ($)</label>
        <input
          type="number"
          id="maxLimit"
          required
          min="0"
          step="0.01"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label for="threshold" class="block text-sm font-medium text-slate-700 mb-1">Auto Top-Up Threshold ($)</label>
        <input
          type="number"
          id="threshold"
          required
          min="0"
          step="0.01"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label for="topUp" class="block text-sm font-medium text-slate-700 mb-1">Top-Up Amount ($)</label>
        <input
          type="number"
          id="topUp"
          required
          min="0"
          step="0.01"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg transition-colors"
      >
        Save Configuration
      </button>
    </form>
  </div>

  <script>
    const rulesForm = document.getElementById("rules-form");

    async function loadRules() {
      const merchantsInput = document.getElementById("merchants");
      const maxLimitInput = document.getElementById("maxLimit");
      const thresholdInput = document.getElementById("threshold");
      const topUpInput = document.getElementById("topUp");

      const response = await fetch("/api/rules");
      const rules = await response.json();

      merchantsInput.value = rules.allowedMerchants.join(", ");
      maxLimitInput.value = rules.maxSingleTransaction;
      thresholdInput.value = rules.autoTopUpThreshold;
      topUpInput.value = rules.topUpAmount;
    }

    rulesForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const merchantsInput = document.getElementById("merchants");
      const maxLimitInput = document.getElementById("maxLimit");
      const thresholdInput = document.getElementById("threshold");
      const topUpInput = document.getElementById("topUp");

      const payload = {
        allowedMerchants: merchantsInput.value
          .split(",")
          .map((merchant) => merchant.trim())
          .filter((merchant) => merchant.length > 0),
        maxSingleTransaction: Number(maxLimitInput.value),
        autoTopUpThreshold: Number(thresholdInput.value),
        topUpAmount: Number(topUpInput.value),
      };

      const response = await fetch("/api/rules", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      if (response.ok) {
        alert("Rules updated successfully!");
      } else {
        alert("Failed to update rules. Please try again.");
      }
    });

    loadRules();
  </script>
</body>
</html>
